<section class="section builder-cta-section">
    <div class="container">
        <div class="builder-cta">
            <div>
                <p class="eyebrow">Ready to Start?</p>
                <h2>{{ section.heading }}</h2>

                {% if section.text %}
                    <p>{{ section.text }}</p>
                {% endif %}
            </div>

            {% if section.button_label and section.button_url starts with '/' %}
                <a class="button button-primary" href="{{ section.button_url }}">
                    {{ section.button_label }}
                </a>
            {% endif %}
        </div>
    </div>
</section>

# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Service Category

# Model Form Field configuration
form: $/ziad/services/models/servicecategory/fields.yaml

# Model Class name
modelClass: Ziad\Services\Models\ServiceCategory

# Default redirect location
defaultRedirect: ziad/services/servicecategories

# Create page
create:
    title: backend::lang.form.create_title
    redirect: ziad/services/servicecategories/update/:id
    redirectClose: ziad/services/servicecategories

# Update page
update:
    title: backend::lang.form.update_title
    redirect: ziad/services/servicecategories
    redirectClose: ziad/services/servicecategories

# Preview page
preview:
    title: backend::lang.form.preview_title

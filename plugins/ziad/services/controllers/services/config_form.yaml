# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Service

# Model Form Field configuration
form: $/ziad/services/models/service/fields.yaml

# Model Class name
modelClass: Ziad\Services\Models\Service

# Default redirect location
defaultRedirect: ziad/services/services

# Create page
create:
    title: backend::lang.form.create_title
    redirect: ziad/services/services/update/:id
    redirectClose: ziad/services/services

# Update page
update:
    title: backend::lang.form.update_title
    redirect: ziad/services/services
    redirectClose: ziad/services/services

# Preview page
preview:
    title: backend::lang.form.preview_title

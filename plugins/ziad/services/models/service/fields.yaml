fields:
    title:
        label: Service Title
        type: text
        span: full
        required: true
        placeholder: Enter the service title

    category_id:
        label: Service Category
        type: dropdown
        span: full
        required: true
        emptyOption: Select a category
        comment: Select an active category for this service

    image:
        label: Service Image
        type: fileupload
        mode: image
        span: full
        imageWidth: 400
        imageHeight: 240
        fileTypes: jpg,jpeg,png,webp
        maxFiles: 1
        comment: Upload a JPG, PNG, or WebP service image

    short_description:
        label: Short Description
        type: textarea
        size: small
        span: full
        required: true
        placeholder: Enter a short summary
        comment: Maximum 500 characters

    content:
        label: Detailed Content
        type: richeditor
        size: large
        span: full
        toolbarButtons: bold|italic|formatOL|formatUL|insertLink

    is_active:
        label: Active
        type: switch
        span: left
        default: true
        comment: Only active services in active categories appear publicly

    sort_order:
        label: Display Order
        type: number
        span: right
        default: 0
        required: true
        min: 0
        comment: Lower numbers appear first